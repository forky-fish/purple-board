<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Session Dock</title>
<style>
:root{--bg:#fff;--fg:#1c1b22;--mut:#6b6978;--line:#e4e2ec;--acc:#7c4dff;--ok:#2e9e5b;--warn:#c98a00;--bad:#d03a3a;--card:#f7f6fb}
@media (prefers-color-scheme:dark){:root{--bg:#15141a;--fg:#ecebf3;--mut:#9a98aa;--line:#2b2a35;--acc:#a98bff;--ok:#4cc882;--warn:#e3b341;--bad:#ef6b6b;--card:#1d1c25}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:0}h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:24px 0 8px}
.sub{color:var(--mut);font-size:13px}code{font:13px ui-monospace,monospace;background:var(--card);padding:1px 5px;border-radius:4px}
.meter{display:grid;grid-template-columns:70px 1fr 44px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.track{height:8px;background:var(--card);border-radius:4px;overflow:hidden}.fill{height:100%;background:var(--ok)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.alarm{background:var(--bad);color:#fff;font-weight:600;padding:4px 10px;border-radius:6px;margin:8px 0}.spark{color:var(--acc);letter-spacing:1px}
.row{display:flex;justify-content:space-between;align-items:center}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover{border-color:var(--acc)}ul{padding-left:20px;margin:6px 0}li{margin:2px 0}
.card h1,.card h2,.card h3{font-size:14px;text-transform:none;letter-spacing:0;color:var(--fg);margin:12px 0 4px}
.tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--line)}.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;color:var(--mut)}.tabs button.on{color:var(--fg);border-bottom-color:var(--acc)}
.srow{display:grid;grid-template-columns:14px 1fr auto;gap:2px 8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}.srow.dim{opacity:.55}.srow .meta{grid-column:2/4;color:var(--mut)}
.note{display:flex;gap:8px;align-items:center;padding:3px 0}.note span{flex:1}.note.done span{color:var(--mut);text-decoration:line-through}.note button{padding:0 6px}form.row{gap:8px;margin-bottom:8px}form input,form select{font:inherit;font-size:13px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 8px}form input{flex:1}
iframe.art{width:100%;height:70vh;border:1px solid var(--line);border-radius:6px;margin-top:8px;background:#fff}.tabs.sub{flex-wrap:wrap}
ul.tl{list-style:none;padding:0}
</style></head><body><main><nav class="tabs" id="tabs"></nav><div id="app"><p class="sub">loading…</p></div></main>
<script>
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const inl=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
function meter(label,p){p=Math.round(p??0);const c=p>=85?'var(--bad)':p>=65?'var(--warn)':'var(--ok)';
 return `<div class="meter"><span>${esc(label)}</span><div class="track"><div class="fill" style="width:${p}%;background:${c}"></div></div><span>${p}%</span></div>`}
function md(t){let h='',list=false;for(const l of t.split('\n')){let m;
 if((m=l.match(/^(#{1,3})\s+(.*)/))){if(list){h+='</ul>';list=false}h+=`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`}
 else if((m=l.match(/^\s*[-*]\s+(\[[ xX]\]\s+)?(.*)/))){if(!list){h+='<ul>';list=true}h+=`<li>${m[1]?(/x/i.test(m[1])?'☑ ':'☐ '):''}${inl(m[2])}</li>`}
 else if(l.trim()){if(list){h+='</ul>';list=false}h+=`<p>${inl(l)}</p>`}}
 return h+(list?'</ul>':'')}
const clk=ms=>{const d=new Date(ms);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
function planLine(s){const it=((s.state.modules||{}).plan||{}).items;if(!Array.isArray(it)||!it.length)return '';const n=it.filter(i=>i.status==='completed').length,w=it.find(i=>i.status==='in_progress');return `plan ${n}/${it.length}${w?', now: '+w.activeForm:n===it.length?', all done':''}`}
function ago(ms){const m=Math.round(ms/6e4);return m<1?'just now':m<60?m+' min ago':Math.round(m/6)/10+' h ago'}
const SPARK='▁▂▃▄▅▆▇█';
const spark=v=>(v||[]).length<2?'':v.map(x=>SPARK[Math.min(7,Math.max(0,Math.floor(x/100*8)))]).join('');
const lab=k=>({five_hour:'5 h',seven_day:'7 d'})[k]||k;
let tab=(()=>{try{return localStorage.getItem('dock-tab')||'overview'}catch{return 'overview'}})();
const TABS=[['overview','Overview'],['sessions','Sessions'],['notes','Notes'],['artifacts','Artifacts']];
function drawTabs(){const t=document.getElementById('tabs');t.innerHTML=TABS.map(([id,l])=>`<button data-t="${id}" class="${id===tab?'on':''}">${l}</button>`).join('');
 t.querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.getElementById('app').dataset.sig='';try{localStorage.setItem('dock-tab',tab)}catch{}draw()})}
const DOTC={busy:'var(--warn)',idle:'var(--ok)',waiting:'var(--bad)',gone:'var(--mut)'};
async function drawSessions(){let r;try{r=await (await fetch('/sessions')).json()}catch{return}
 document.getElementById('app').innerHTML=r.rows.length?r.rows.map(x=>`<div class="srow${x.status==='gone'?' dim':''}"><span class="dot" style="background:${DOTC[x.status]}"></span><span><b>${x.id===r.current?'▸ ':''}${esc(x.name)}</b> <code>${esc(x.project)}</code></span><span class="sub">${ago(Date.now()-x.updatedAt)}</span><span class="meta">${esc(x.model)} · ${typeof x.context==='number'?Math.round(x.context)+'% ctx':'–'}${x.branch?' · ⎇ '+esc(x.branch):''}</span></div>`).join(''):'<p class="sub">No session active in the last 24 hours.</p>'}
let noteScope='project';
async function postNote(b){const r=await fetch('/notes',{method:'POST',body:JSON.stringify(b)});return r.json()}
function noteList(n,scope,title){return `<h2>${title}</h2>`+(n.length?n.map(x=>`<div class="note${x.done?' done':''}"><button data-op="toggle" data-s="${scope}" data-i="${x.index}" data-t="${esc(x.text).replace(/"/g,'&quot;')}">${x.done?'☑':'☐'}</button><span>${esc(x.text)}</span><button data-op="delete" data-s="${scope}" data-i="${x.index}" data-t="${esc(x.text).replace(/"/g,'&quot;')}">✕</button></div>`).join(''):'<p class="sub">no notes</p>')}
async function drawNotes(){const typing=document.getElementById('nt');if(typing&&typing.value)return; // do not wipe a half-typed note
 let n;try{n=await (await fetch('/notes')).json()}catch{return}
 const app=document.getElementById('app');
 app.innerHTML=`<form id="nf" class="row"><select id="ns"><option value="project">project</option><option value="global">global</option></select><input id="nt" placeholder="new note" autocomplete="off"><button>Add</button></form>`+noteList(n.project,'project','This project')+noteList(n.global,'global','Global');
 document.getElementById('ns').value=noteScope;document.getElementById('ns').onchange=e=>noteScope=e.target.value;
 document.getElementById('nf').onsubmit=async e=>{e.preventDefault();const t=document.getElementById('nt');const v=t.value.trim();if(!v)return;t.value='';await postNote({op:'add',scope:document.getElementById('ns').value,text:v});drawNotes()};
 app.querySelectorAll('.note button').forEach(b=>b.onclick=async()=>{await postNote({op:b.dataset.op,scope:b.dataset.s,index:+b.dataset.i,text:b.dataset.t});drawNotes()})}
let artSel=0;
async function drawArtifacts(){let r;try{r=await (await fetch('/artifacts')).json()}catch{return}
 const app=document.getElementById('app'),it=r.items;
 if(!it.length){app.innerHTML='<p class="sub">No artifact published in this session.</p>';return}
 if(artSel>=it.length)artSel=0;const a=it[artSel];
 // rebuild only when the selection or list changed, so the iframe is not reloaded every poll
 const sig=JSON.stringify([artSel,it.map(i=>i.url)]);if(app.dataset.sig===sig)return;app.dataset.sig=sig;
 app.innerHTML=`<div class="tabs sub">${it.map((i,n)=>`<button data-n="${n}" class="${n===artSel?'on':''}">${esc(i.title)}</button>`).join('')}</div>
 <div class="row"><span class="sub">${ago(Date.now()-a.at)}</span><a href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">Open original ↗</a></div>
 ${a.html?`<iframe sandbox="allow-scripts" class="art" src="/artifact-file?path=${encodeURIComponent(a.file_path)}"></iframe>`:'<p class="sub">No local HTML source to show; use Open original.</p>'}`;
 app.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{artSel=+b.dataset.n;drawArtifacts()})}
async function draw(){drawTabs();if(tab==='artifacts')return drawArtifacts();if(tab==='sessions')return drawSessions();if(tab==='notes')return drawNotes();return drawOverview()}
async function drawOverview(){let s;try{s=await (await fetch('/state')).json()}catch{return}
 if(!s.view){document.getElementById('app').innerHTML='<p class="sub">no session found for this directory: start Claude Code here with the session-dock plugin</p>';return}
 const {session:se={},usage:u={},git:g={},commits=[]}=s.view,ov=(s.state.modules||{}).overview||{},d=ov.away||{},files=d.files||[];
 const stale=Date.now()-s.updatedAt>6e5,busy=se.busy&&!stale;
 const hot=[['context',u.contextPercent],...(u.rateLimits||[]).map(r=>[lab(r.kind),r.percentUsed])].filter(([,p])=>p>=85);
 const b=[`${d.turns||0} turns, ${Math.round((d.workMs||0)/6e4)} min of work`];
 if(commits.length){b.push(`${commits.length} commits${d.pushes?', pushed':''}<ul>${commits.slice(0,5).map(c=>`<li><code>${esc(c.slice(0,80))}</code></li>`).join('')}</ul>`)}
 if(files.length)b.push(`${files.length} files edited: ${files.slice(-6).map(f=>`<code>${esc(f)}</code>`).join(' ')}`);
 if(d.tests)b.push(`tests run ${d.tests}×`);if(d.agents)b.push(`${d.agents} subagents`);
 document.getElementById('app').innerHTML=`
 <h1><span class="dot" style="background:${busy?'var(--warn)':stale?'var(--mut)':'var(--ok)'}"></span>${esc(se.name||'session')}</h1>
 <div class="sub"><code>${esc(se.model||'?')}</code> · ${esc(g.branch||'no branch')}${g.dirty?' · '+g.dirty+' uncommitted':' · clean'}</div>
 ${planLine(s)?`<div class="sub">☰ ${esc(planLine(s))}</div>`:''}
 ${hot.length?`<div class="alarm">⚠ ${hot.map(([l,p])=>esc(l)+' '+Math.round(p)+'%').join(' · ')}</div>`:''}
 <h2>Usage</h2>${meter('context',u.contextPercent)}${(u.rateLimits||[]).map(r=>meter(lab(r.kind),r.percentUsed)).join('')}
 ${spark(ov.history)?`<div class="sub">trend <span class="spark">${spark(ov.history)}</span></div>`:''}${u.costUsd!==undefined?`<div class="sub">cost $${u.costUsd.toFixed(2)}</div>`:''}
 <div class="row"><h2>Since you were away <span class="sub">(${s.state.since?ago(Date.now()-s.state.since):'session start'})</span></h2><button id="reset">⟲ Reset</button></div>
 <ul>${b.map(x=>`<li>${x}</li>`).join('')}</ul>
 ${(ov.timeline||[]).length?`<h2>Timeline</h2><ul class="tl">${ov.timeline.slice(-5).map(t=>`<li><span class="sub">${clk(t.at)}</span> ${esc(t.text)}</li>`).join('')}</ul>`:''}
 ${s.card?`<h2>Card</h2><div class="card">${md(s.card)}</div>`:''}
 <p class="sub">updated ${ago(Date.now()-s.updatedAt)}</p>`;
 document.getElementById('reset').onclick=async()=>{await fetch('/reset',{method:'POST'});setTimeout(draw,1500)}}
draw();setInterval(draw,3000);
</script></body></html>
